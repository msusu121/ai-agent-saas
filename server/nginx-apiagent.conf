upstream sales_api {
    server 127.0.0.1:4400;
    keepalive 64;
}

server {
    listen 80;
    server_name apiagent.akilimatic.com;

    access_log /var/log/nginx/apiagent-access.log;
    error_log /var/log/nginx/apiagent-error.log;

    # Health checks
    location /health/live {
        proxy_pass http://sales_api/health/live;
        proxy_set_header Host $host;
        access_log off;
    }

    location /health/ready {
        proxy_pass http://sales_api/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    # API routes
    location /api/v1 {
        proxy_pass http://sales_api/api/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # WebSocket support for any future WebSocket endpoints
    location /ws {
        proxy_pass http://sales_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
